<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var savedScheme = localStorage.getItem("color-scheme");
      if (savedScheme === "light" || savedScheme === "dark") {
        document.querySelector('meta[name="color-scheme"]').content = savedScheme;
      }
    } catch (e) {}
  </script>
  <title>Link to QR | QR Code Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><rect x='3' y='3' width='7' height='7'/><rect x='14' y='3' width='7' height='7'/><rect x='14' y='14' width='7' height='7'/><rect x='3' y='14' width='7' height='7'/></svg>">
  <script src="/qrcode.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;

      /* Light tokens */
      --bg-light: #f8fafc;
      --surface-light: #ffffff;
      --surface-hover-light: #f1f5f9;
      --input-bg-light: #ffffff;
      --border-light: #cbd5e1;
      --border-hover-light: #94a3b8;
      --text-main-light: #0f172a;
      --text-muted-light: #475569;
      --text-dim-light: #475569;
      --accent-light: #2563eb;
      --accent-hover-light: #1d4ed8;
      --accent-bg-light: #eff6ff;
      --success-light: #047857;
      --danger-light: #b91c1c;
      --danger-bg-light: #fef2f2;
      --badge-bg-light: #f1f5f9;
      --shadow-card-light: 0 4px 16px rgba(15, 23, 42, 0.06);

      /* Dark tokens */
      --bg-dark: #090a0b;
      --surface-dark: #121316;
      --surface-hover-dark: #18191d;
      --input-bg-dark: #0d0e11;
      --border-dark: #2c3038;
      --border-hover-dark: #454a56;
      --text-main-dark: #f3f4f6;
      --text-muted-dark: #b4bcc8;
      --text-dim-dark: #9ca3af;
      --accent-dark: #3b82f6;
      --accent-hover-dark: #2563eb;
      --accent-bg-dark: rgba(59, 130, 246, 0.14);
      --success-dark: #10b981;
      --danger-dark: #f87171;
      --danger-bg-dark: rgba(239, 68, 68, 0.14);
      --badge-bg-dark: #1e2025;
      --shadow-card-dark: 0 4px 20px rgba(0, 0, 0, 0.35);

      /* Active semantic tokens (light default fallback) */
      --bg: var(--bg-light);
      --card-bg: var(--surface-light);
      --card-hover: var(--surface-hover-light);
      --input-bg: var(--input-bg-light);
      --border: var(--border-light);
      --border-hover: var(--border-hover-light);
      --text-main: var(--text-main-light);
      --text-muted: var(--text-muted-light);
      --text-dim: var(--text-dim-light);
      --accent: var(--accent-light);
      --accent-hover: var(--accent-hover-light);
      --accent-bg: var(--accent-bg-light);
      --success: var(--success-light);
      --danger: var(--danger-light);
      --danger-bg: var(--danger-bg-light);
      --badge-bg: var(--badge-bg-light);
      --shadow-card: var(--shadow-card-light);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      accent-color: var(--accent);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --card-bg: var(--surface-dark);
        --card-hover: var(--surface-hover-dark);
        --input-bg: var(--input-bg-dark);
        --border: var(--border-dark);
        --border-hover: var(--border-hover-dark);
        --text-main: var(--text-main-dark);
        --text-muted: var(--text-muted-dark);
        --text-dim: var(--text-dim-dark);
        --accent: var(--accent-dark);
        --accent-hover: var(--accent-hover-dark);
        --accent-bg: var(--accent-bg-dark);
        --success: var(--success-dark);
        --danger: var(--danger-dark);
        --danger-bg: var(--danger-bg-dark);
        --badge-bg: var(--badge-bg-dark);
        --shadow-card: var(--shadow-card-dark);
      }
    }

    :root:has(> head > meta[name="color-scheme"][content="dark"]) {
      color-scheme: dark;
      --bg: var(--bg-dark);
      --card-bg: var(--surface-dark);
      --card-hover: var(--surface-hover-dark);
      --input-bg: var(--input-bg-dark);
      --border: var(--border-dark);
      --border-hover: var(--border-hover-dark);
      --text-main: var(--text-main-dark);
      --text-muted: var(--text-muted-dark);
      --text-dim: var(--text-dim-dark);
      --accent: var(--accent-dark);
      --accent-hover: var(--accent-hover-dark);
      --accent-bg: var(--accent-bg-dark);
      --success: var(--success-dark);
      --danger: var(--danger-dark);
      --danger-bg: var(--danger-bg-dark);
      --badge-bg: var(--badge-bg-dark);
      --shadow-card: var(--shadow-card-dark);
    }

    :root:has(> head > meta[name="color-scheme"][content="light"]) {
      color-scheme: light;
      --bg: var(--bg-light);
      --card-bg: var(--surface-light);
      --card-hover: var(--surface-hover-light);
      --input-bg: var(--input-bg-light);
      --border: var(--border-light);
      --border-hover: var(--border-hover-light);
      --text-main: var(--text-main-light);
      --text-muted: var(--text-muted-light);
      --text-dim: var(--text-dim-light);
      --accent: var(--accent-light);
      --accent-hover: var(--accent-hover-light);
      --accent-bg: var(--accent-bg-light);
      --success: var(--success-light);
      --danger: var(--danger-light);
      --danger-bg: var(--danger-bg-light);
      --badge-bg: var(--badge-bg-light);
      --shadow-card: var(--shadow-card-light);
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --card-bg: light-dark(var(--surface-light), var(--surface-dark));
        --card-hover: light-dark(var(--surface-hover-light), var(--surface-hover-dark));
        --input-bg: light-dark(var(--input-bg-light), var(--input-bg-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --border-hover: light-dark(var(--border-hover-light), var(--border-hover-dark));
        --text-main: light-dark(var(--text-main-light), var(--text-main-dark));
        --text-muted: light-dark(var(--text-muted-light), var(--text-muted-dark));
        --text-dim: light-dark(var(--text-dim-light), var(--text-dim-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
        --accent-hover: light-dark(var(--accent-hover-light), var(--accent-hover-dark));
        --accent-bg: light-dark(var(--accent-bg-light), var(--accent-bg-dark));
        --success: light-dark(var(--success-light), var(--success-dark));
        --danger: light-dark(var(--danger-light), var(--danger-dark));
        --danger-bg: light-dark(var(--danger-bg-light), var(--danger-bg-dark));
        --badge-bg: light-dark(var(--badge-bg-light), var(--badge-bg-dark));
        --shadow-card: light-dark(var(--shadow-card-light), var(--shadow-card-dark));
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    :where(a:any-link, button, input, select):focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 0.75rem;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .header-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-block-size: 36px;
      min-inline-size: 36px;
      color: var(--text-muted);
      background: transparent;
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: inherit;
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .header-btn:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    /* Theme toggle icon branching driven by meta[name="color-scheme"] + OS fallback */
    .theme-state-dark {
      display: none;
    }

    .theme-state-light {
      display: inline-flex;
      align-items: center;
    }

    @media (prefers-color-scheme: dark) {
      .theme-state-light {
        display: none;
      }
      .theme-state-dark {
        display: inline-flex;
        align-items: center;
      }
    }

    :root:has(> head > meta[name="color-scheme"][content="dark"]) .theme-state-light {
      display: none;
    }
    :root:has(> head > meta[name="color-scheme"][content="dark"]) .theme-state-dark {
      display: inline-flex;
      align-items: center;
    }

    :root:has(> head > meta[name="color-scheme"][content="light"]) .theme-state-light {
      display: inline-flex;
      align-items: center;
    }
    :root:has(> head > meta[name="color-scheme"][content="light"]) .theme-state-dark {
      display: none;
    }

    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .hero {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .hero h1 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .app-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1.75rem;
      align-items: start;
    }

    @media (max-width: 820px) {
      .app-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-card);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .form-label-row .form-label {
      margin-bottom: 0;
    }

    .char-count {
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      min-block-size: 46px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: max(1rem, 1em);
      padding: 0.65rem 6.25rem 0.65rem 0.9rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .text-input:focus {
      border-color: var(--accent);
    }

    .input-actions {
      position: absolute;
      right: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .btn-ghost-sm {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      min-block-size: 32px;
      min-inline-size: 32px;
      padding: 0.3rem 0.55rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 500;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-ghost-sm:hover {
      background: var(--badge-bg);
      color: var(--text-main);
    }

    /* Customization options */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .select-input {
      width: 100%;
      min-block-size: 40px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      font-family: inherit;
    }

    .color-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.45rem;
    }

    .color-header .form-label {
      margin-bottom: 0;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 2px;
      cursor: pointer;
      background: var(--input-bg);
    }

    .color-hex {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      color: var(--text-dim);
    }

    /* Recent links history */
    .history-section {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .history-title {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-chips {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .history-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      min-block-size: 38px;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      color: var(--text-muted);
      overflow: hidden;
    }

    .history-item:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
      color: var(--text-main);
    }

    .history-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .history-arrow {
      font-size: 0.8rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* QR preview area */
    .preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .qr-box-wrapper {
      background: #ffffff;
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      min-height: 260px;
      max-width: 100%;
      transition: transform 0.2s ease;
    }

    .qr-box-wrapper:hover {
      transform: scale(1.02);
    }

    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .qr-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: #475569;
      text-align: center;
      padding: 1.5rem;
    }

    .qr-placeholder svg {
      opacity: 0.5;
    }

    .qr-placeholder span {
      font-size: 0.875rem;
      max-width: 190px;
    }

    .qr-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      width: 100%;
      max-width: 320px;
    }

    .qr-error[hidden] {
      display: none;
    }

    /* QR actions */
    .qr-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
      max-width: 320px;
      transition: opacity 0.15s ease;
    }

    .qr-actions[inert] {
      opacity: 0.5;
      cursor: default;
      user-select: none;
    }

    .btn-primary {
      width: 100%;
      min-block-size: 42px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .btn-secondary {
      min-block-size: 38px;
      background: var(--badge-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
    }

    .btn-secondary[hidden] {
      display: none;
    }

    /* Accessible toast region */
    .toast-region {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }

    .toast {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-hover);
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .toast-icon {
      color: var(--success);
      flex-shrink: 0;
    }

    .toast.is-error .toast-icon {
      color: var(--danger);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem;
      background: var(--bg);
      font-size: 0.8125rem;
      color: var(--text-dim);
      text-align: center;
    }

    @media (pointer: coarse) {
      .header-btn,
      .btn-ghost-sm,
      .btn-secondary,
      .btn-primary,
      .history-item,
      .select-input {
        min-block-size: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
      .qr-box-wrapper:hover {
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .card,
      .qr-box-wrapper,
      .header-btn,
      .btn-secondary,
      .btn-primary,
      .toast {
        border: 1px solid ButtonText;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </div>
        <div class="brand-title">Link to QR</div>
        <span class="brand-badge">Tool</span>
      </div>
      <div class="header-actions">
        <button type="button" id="btnThemeToggle" class="header-btn" title="Toggle light/dark theme">
          <span class="theme-state-light">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="visually-hidden">Switch to dark theme</span>
          </span>
          <span class="theme-state-dark">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="visually-hidden">Switch to light theme</span>
          </span>
        </button>
        <a href="http://127.0.0.1:7777" class="header-btn">
          <span aria-hidden="true">⚡</span>
          <span>Back to Hub</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Instant QR Code Generator</h1>
      <p>Paste any link or text to generate, copy, and download your QR code instantaneously.</p>
    </section>

    <div class="app-grid">
      <!-- Left Column: Input & Customization -->
      <div class="card">
        <form id="qrForm" action="#" novalidate>
          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label" for="linkInput">Link or Text</label>
              <span id="charCount" class="char-count" aria-live="off">0 characters</span>
            </div>
            <div class="input-wrapper">
              <input
                type="text"
                id="linkInput"
                name="text"
                class="text-input"
                placeholder="https://example.com"
                autocomplete="url"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="done"
                autofocus
              >
              <div class="input-actions">
                <button type="button" class="btn-ghost-sm" id="btnPaste">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                  </svg>
                  <span>Paste</span>
                </button>
                <button type="button" class="btn-ghost-sm" id="btnClear" aria-label="Clear link input" hidden>
                  <span aria-hidden="true">✕</span>
                </button>
              </div>
            </div>
          </div>

          <div class="options-grid">
            <div>
              <label class="form-label" for="sizeSelect">Export size</label>
              <select id="sizeSelect" name="size" class="select-input">
                <option value="256">256 × 256 px (Standard)</option>
                <option value="384" selected>384 × 384 px (Medium)</option>
                <option value="512">512 × 512 px (High Clarity)</option>
                <option value="1024">1024 × 1024 px (Ultra HD)</option>
              </select>
            </div>

            <div>
              <label class="form-label" for="errorLevelSelect">Error correction</label>
              <select id="errorLevelSelect" name="errorLevel" class="select-input">
                <option value="L">L (Low - 7%)</option>
                <option value="M">M (Medium - 15%)</option>
                <option value="Q">Q (Quartile - 25%)</option>
                <option value="H" selected>H (High - 30%)</option>
              </select>
            </div>

            <div>
              <div class="color-header">
                <label class="form-label" for="fgColor">QR Color</label>
              </div>
              <div class="color-picker-row">
                <input type="color" id="fgColor" name="fgColor" value="#000000" class="color-swatch">
                <span id="fgColorLabel" class="color-hex">#000000</span>
              </div>
            </div>

            <div>
              <div class="color-header">
                <label class="form-label" for="bgColor">Background Color</label>
                <button type="button" class="btn-ghost-sm" id="btnResetColors" aria-label="Reset colors to black and white">Reset</button>
              </div>
              <div class="color-picker-row">
                <input type="color" id="bgColor" name="bgColor" value="#ffffff" class="color-swatch">
                <span id="bgColorLabel" class="color-hex">#ffffff</span>
              </div>
            </div>
          </div>
        </form>

        <section class="history-section" id="historySection" aria-label="Recent links" hidden>
          <div class="history-title">
            <span>Recent links</span>
            <button type="button" class="btn-ghost-sm" id="btnClearHistory">Clear</button>
          </div>
          <div class="history-chips" id="historyChips"></div>
        </section>
      </div>

      <!-- Right Column: Preview & Export Actions -->
      <div class="card preview-card">
        <div class="qr-box-wrapper" id="qrWrapper">
          <div id="qrcode">
            <div class="qr-placeholder" id="qrPlaceholder">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              <span>Type or paste a link to generate a QR code</span>
            </div>
          </div>
        </div>

        <div id="qrError" class="qr-error" role="alert" hidden></div>

        <div class="qr-actions" id="qrActions" inert>
          <button type="button" class="btn-primary" id="btnCopyImage">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy Image to Clipboard</span>
          </button>

          <div class="btn-row">
            <button type="button" class="btn-secondary" id="btnDownloadPNG">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Download PNG</span>
            </button>
            <button type="button" class="btn-secondary" id="btnDownloadSVG">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
              </svg>
              <span>Download SVG</span>
            </button>
          </div>

          <a href="#" target="_blank" rel="noopener noreferrer" class="btn-secondary" id="btnTestLink" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            <span>Open link in new tab</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-region" role="region" aria-label="Notifications">
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <svg class="toast-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span id="toastMessage"></span>
    </div>
  </div>

  <footer>
    Link to QR &bull; Powered by Tools Hub
  </footer>

  <script>
    const qrForm = document.getElementById('qrForm');
    const linkInput = document.getElementById('linkInput');
    const charCount = document.getElementById('charCount');
    const btnPaste = document.getElementById('btnPaste');
    const btnClear = document.getElementById('btnClear');
    const sizeSelect = document.getElementById('sizeSelect');
    const errorLevelSelect = document.getElementById('errorLevelSelect');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const fgColorLabel = document.getElementById('fgColorLabel');
    const bgColorLabel = document.getElementById('bgColorLabel');
    const btnResetColors = document.getElementById('btnResetColors');
    const qrcodeContainer = document.getElementById('qrcode');
    const qrPlaceholder = document.getElementById('qrPlaceholder');
    const qrError = document.getElementById('qrError');
    const qrActions = document.getElementById('qrActions');
    const qrWrapper = document.getElementById('qrWrapper');
    const btnCopyImage = document.getElementById('btnCopyImage');
    const btnDownloadPNG = document.getElementById('btnDownloadPNG');
    const btnDownloadSVG = document.getElementById('btnDownloadSVG');
    const btnTestLink = document.getElementById('btnTestLink');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    const historySection = document.getElementById('historySection');
    const historyChips = document.getElementById('historyChips');
    const btnClearHistory = document.getElementById('btnClearHistory');
    const btnThemeToggle = document.getElementById('btnThemeToggle');
    const colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');

    let qrInstance = null;
    let toastTimeout = null;
    let historyDebounce = null;
    let lastToastText = '';
    const STORAGE_KEY_HISTORY = 'link_to_qr_history';
    const STORAGE_KEY_SCHEME = 'color-scheme';

    // --- Theme Management (two-state override aligned with OS preference) ---
    function getSystemScheme() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyScheme(scheme) {
      if (colorSchemeMeta) {
        colorSchemeMeta.content = scheme === 'light' || scheme === 'dark' ? scheme : 'light dark';
      }
    }

    btnThemeToggle.addEventListener('click', () => {
      let currentStored = null;
      try {
        currentStored = localStorage.getItem(STORAGE_KEY_SCHEME);
      } catch (e) {}

      const systemScheme = getSystemScheme();
      const renderedScheme = currentStored === 'light' || currentStored === 'dark' ? currentStored : systemScheme;
      const targetScheme = renderedScheme === 'dark' ? 'light' : 'dark';

      try {
        if (targetScheme === systemScheme) {
          localStorage.removeItem(STORAGE_KEY_SCHEME);
          applyScheme('light dark');
        } else {
          localStorage.setItem(STORAGE_KEY_SCHEME, targetScheme);
          applyScheme(targetScheme);
        }
      } catch (e) {
        applyScheme(targetScheme === systemScheme ? 'light dark' : targetScheme);
      }
    });

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY_SCHEME) {
        applyScheme(e.newValue === 'light' || e.newValue === 'dark' ? e.newValue : 'light dark');
      }
    });

    // --- Toast Notifications ---
    function showToast(msg, isError = false) {
      if (toastTimeout) clearTimeout(toastTimeout);

      let text = msg;
      if (text === lastToastText) {
        text += '\u00A0';
      }
      lastToastText = msg;

      toast.classList.toggle('is-error', isError);
      toastMessage.textContent = '';
      toast.classList.add('show');
      requestAnimationFrame(() => {
        toastMessage.textContent = text;
      });

      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          if (!toast.classList.contains('show')) {
            toastMessage.textContent = '';
          }
        }, 250);
      }, 2600);
    }

    function getCorrectionLevel(levelStr) {
      switch (levelStr) {
        case 'L': return QRCode.CorrectLevel.L;
        case 'M': return QRCode.CorrectLevel.M;
        case 'Q': return QRCode.CorrectLevel.Q;
        case 'H':
        default: return QRCode.CorrectLevel.H;
      }
    }

    function resetPreviewToEmpty() {
      qrcodeContainer.innerHTML = '';
      qrcodeContainer.appendChild(qrPlaceholder);
      qrActions.inert = true;
      btnTestLink.hidden = true;
      btnTestLink.href = '#';
      qrWrapper.style.backgroundColor = '#ffffff';
      qrError.hidden = true;
      qrError.textContent = '';
      qrInstance = null;
    }

    function generateQR(commitHistory = false) {
      const text = linkInput.value.trim();
      charCount.textContent = `${text.length} character${text.length === 1 ? '' : 's'}`;
      btnClear.hidden = !text;

      if (historyDebounce) {
        clearTimeout(historyDebounce);
        historyDebounce = null;
      }

      if (!text) {
        resetPreviewToEmpty();
        return;
      }

      const size = parseInt(sizeSelect.value, 10) || 384;
      const fg = fgColor.value;
      const bg = bgColor.value;
      const correctLevel = getCorrectionLevel(errorLevelSelect.value);

      qrWrapper.style.backgroundColor = bg;
      qrcodeContainer.innerHTML = '';
      qrError.hidden = true;
      qrError.textContent = '';

      try {
        qrInstance = new QRCode(qrcodeContainer, {
          text: text,
          width: size,
          height: size,
          colorDark: fg,
          colorLight: bg,
          correctLevel: correctLevel
        });

        const img = qrcodeContainer.querySelector('img');
        if (img) {
          img.alt = 'Generated QR code';
        }

        qrActions.inert = false;

        if (/^https?:\/\//i.test(text)) {
          btnTestLink.href = text;
          btnTestLink.hidden = false;
        } else {
          btnTestLink.hidden = true;
          btnTestLink.href = '#';
        }

        if (commitHistory) {
          saveToHistory(text);
        } else {
          historyDebounce = setTimeout(() => saveToHistory(text), 800);
        }
      } catch (err) {
        console.error('QR generation error:', err);
        resetPreviewToEmpty();
        qrError.textContent = 'Text is too long for the selected error correction level. Try shortening it or selecting a lower level (L or M).';
        qrError.hidden = false;
      }
    }

    function getSVGContent() {
      const text = linkInput.value.trim();
      if (!text || !qrInstance || !qrInstance._oQRCode || !qrInstance._oQRCode.modules) {
        return null;
      }
      const modules = qrInstance._oQRCode.modules;
      const count = modules.length;
      const margin = 2;
      const total = count + margin * 2;
      const fg = fgColor.value;
      const bg = bgColor.value;
      const size = parseInt(sizeSelect.value, 10) || 512;

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${size}" height="${size}" shape-rendering="crispEdges">\n`;
      if (bg) {
        svg += `  <rect width="100%" height="100%" fill="${bg}"/>\n`;
      }
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (modules[r][c]) {
            svg += `  <rect x="${c + margin}" y="${r + margin}" width="1" height="1" fill="${fg}"/>\n`;
          }
        }
      }
      svg += '</svg>';
      return svg;
    }

    function sanitizeFilename(text) {
      return text.replace(/https?:\/\//i, '')
        .replace(/[^a-z0-9_-]/gi, '_')
        .substring(0, 30) || 'qr_code';
    }

    // Prevent accidental form reload on Enter
    qrForm.addEventListener('submit', (e) => {
      e.preventDefault();
      generateQR(true);
    });

    // Copy PNG image to clipboard
    btnCopyImage.addEventListener('click', async () => {
      const text = linkInput.value.trim();
      if (text) saveToHistory(text);

      try {
        if (!navigator.clipboard || typeof ClipboardItem === 'undefined') {
          throw new Error('Clipboard image API unavailable');
        }

        const canvas = qrcodeContainer.querySelector('canvas');
        if (canvas) {
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
          if (!blob) throw new Error('Could not convert QR canvas to PNG');
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          showToast('QR image copied to clipboard!');
          return;
        }

        const img = qrcodeContainer.querySelector('img');
        if (img && img.src) {
          const res = await fetch(img.src);
          const blob = await res.blob();
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          showToast('QR image copied to clipboard!');
        }
      } catch (err) {
        console.warn('Could not copy image:', err);
        showToast('Automatic copy unavailable. Use Download PNG instead.', true);
      }
    });

    // Download PNG
    btnDownloadPNG.addEventListener('click', () => {
      const text = linkInput.value.trim();
      if (!text) return;
      saveToHistory(text);
      const filename = `${sanitizeFilename(text)}.png`;
      const canvas = qrcodeContainer.querySelector('canvas');
      if (canvas) {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = filename;
        a.click();
        showToast('PNG download started');
      } else {
        const img = qrcodeContainer.querySelector('img');
        if (img && img.src) {
          const a = document.createElement('a');
          a.href = img.src;
          a.download = filename;
          a.click();
          showToast('PNG download started');
        }
      }
    });

    // Download SVG
    btnDownloadSVG.addEventListener('click', () => {
      const text = linkInput.value.trim();
      if (!text) return;
      saveToHistory(text);
      const svgStr = getSVGContent();
      if (!svgStr) {
        showToast('Could not generate SVG output', true);
        return;
      }
      const filename = `${sanitizeFilename(text)}.svg`;
      const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast('SVG download started');
    });

    btnTestLink.addEventListener('click', () => {
      const text = linkInput.value.trim();
      if (text) saveToHistory(text);
    });

    // Paste from clipboard
    btnPaste.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          linkInput.value = text;
          generateQR(true);
          showToast('Link pasted');
        } else {
          showToast('Clipboard is empty', true);
        }
      } catch (e) {
        linkInput.focus();
        showToast('Press Ctrl+V to paste');
      }
    });

    // Clear input
    btnClear.addEventListener('click', () => {
      linkInput.value = '';
      linkInput.focus();
      generateQR();
    });

    // Reset colors
    btnResetColors.addEventListener('click', () => {
      fgColor.value = '#000000';
      bgColor.value = '#ffffff';
      fgColorLabel.textContent = '#000000';
      bgColorLabel.textContent = '#ffffff';
      if (linkInput.value.trim()) {
        generateQR();
      }
      showToast('Colors reset');
    });

    // Input & option listeners
    linkInput.addEventListener('input', () => generateQR(false));
    linkInput.addEventListener('blur', () => {
      const text = linkInput.value.trim();
      if (text && qrInstance) saveToHistory(text);
    });
    sizeSelect.addEventListener('change', () => generateQR(false));
    errorLevelSelect.addEventListener('change', () => generateQR(false));

    fgColor.addEventListener('input', (e) => {
      fgColorLabel.textContent = e.target.value;
      generateQR(false);
    });

    bgColor.addEventListener('input', (e) => {
      bgColorLabel.textContent = e.target.value;
      generateQR(false);
    });

    // --- Recent Links History ---
    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY)) || [];
      } catch {
        return [];
      }
    }

    function saveToHistory(text) {
      if (!text || text.length < 3) return;
      try {
        let list = getHistory().filter((item) => item !== text);
        list.unshift(text);
        list = list.slice(0, 5);
        localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(list));
        renderHistory();
      } catch (e) {}
    }

    function renderHistory() {
      const list = getHistory();
      if (list.length === 0) {
        historySection.hidden = true;
        historyChips.replaceChildren();
        return;
      }
      historySection.hidden = false;

      const fragment = document.createDocumentFragment();
      for (const item of list) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'history-item';
        btn.dataset.value = item;

        const textSpan = document.createElement('span');
        textSpan.className = 'history-text';
        textSpan.textContent = item;

        const arrowSpan = document.createElement('span');
        arrowSpan.className = 'history-arrow';
        arrowSpan.setAttribute('aria-hidden', 'true');
        arrowSpan.textContent = '↵';

        btn.append(textSpan, arrowSpan);
        fragment.appendChild(btn);
      }
      historyChips.replaceChildren(fragment);
    }

    historyChips.addEventListener('click', (e) => {
      const btn = e.target.closest('.history-item');
      if (!btn) return;
      linkInput.value = btn.dataset.value || '';
      generateQR(true);
      linkInput.focus();
    });

    btnClearHistory.addEventListener('click', () => {
      try {
        localStorage.removeItem(STORAGE_KEY_HISTORY);
      } catch (e) {}
      renderHistory();
    });

    // Initialize history and URL query auto-generation
    renderHistory();

    const params = new URLSearchParams(window.location.search);
    const initialUrl = params.get('url') || params.get('link') || params.get('text');
    if (initialUrl) {
      linkInput.value = initialUrl;
      generateQR(true);
    }
  </script>
</body>
</html>
